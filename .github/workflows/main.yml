name: PHP Validation

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    name: PHP Validation
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:

      # =====================================================
      # 1. Checkout repository
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. Setup PHP
      # =====================================================
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, openssl
          coverage: none

      # =====================================================
      # 3. Show repository
      # =====================================================
      - name: Show repository
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo "Repository"
          echo "======================================"

          pwd

          echo
          find . -maxdepth 2 -type f | sort

      # =====================================================
      # 4. Extract Repository Panel
      # =====================================================
      - name: Extract TunnelCat Repository Panel
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP=""

          if [ -f "TunnelCat-Repository-Panel-GitHub.zip" ]; then
            ZIP="TunnelCat-Repository-Panel-GitHub.zip"
          fi

          if [ -z "$ZIP" ]; then
            ZIP=$(find . \
              -maxdepth 2 \
              -type f \
              -iname "*Repository*Panel*.zip" \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: Repository Panel ZIP not found."

            echo
            echo "ZIP files:"
            find . -type f -name "*.zip" -print

            exit 1
          fi

          echo "Using:"
          echo "$ZIP"

          rm -rf panel-source
          mkdir -p panel-source

          unzip -q "$ZIP" -d panel-source

          echo
          echo "Extracted files:"
          find panel-source -maxdepth 5 -type f | sort

          # Find the directory containing app/config.php
          PANEL_DIR=""

          while IFS= read -r config; do

            candidate="$(dirname "$(dirname "$config")")"

            if [ -f "$candidate/app/config.php" ] && \
               [ -f "$candidate/public/index.php" ]; then

              PANEL_DIR="$candidate"
              break

            fi

          done < <(
            find panel-source \
              -type f \
              -path "*/app/config.php"
          )

          if [ -z "$PANEL_DIR" ]; then
            echo
            echo "ERROR: TunnelCat Repository Panel was not found."

            echo
            echo "config.php files:"
            find panel-source \
              -type f \
              -name "config.php" \
              -print

            exit 1
          fi

          PANEL_DIR="$(cd "$PANEL_DIR" && pwd)"

          echo
          echo "======================================"
          echo "Panel found"
          echo "======================================"

          echo "$PANEL_DIR"

          echo "PANEL_DIR=$PANEL_DIR" >> "$GITHUB_ENV"

      # =====================================================
      # 5. Verify panel structure
      # =====================================================
      - name: Verify project structure
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PANEL_DIR"

          echo "======================================"
          echo "TunnelCat Repository Panel"
          echo "======================================"

          pwd

          echo
          echo "Files:"
          find . -maxdepth 4 -type f | sort

          echo
          echo "Checking required files..."

          test -f app/config.php

          test -f public/index.php
          test -f public/repo.php

          test -f public/admin/index.php
          test -f public/admin/login.php
          test -f public/admin/logout.php
          test -f public/admin/repository.php
          test -f public/admin/server.php
          test -f public/admin/style.css

          echo
          echo "Project structure: OK"

      # =====================================================
      # 6. PHP lint
      # =====================================================
      - name: Lint all PHP files
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PANEL_DIR"

          FAILED=0

          echo "======================================"
          echo "PHP Lint"
          echo "======================================"

          while IFS= read -r -d '' file; do

            echo
            echo "Checking:"
            echo "$file"

            if ! php -l "$file"; then
              FAILED=1
            fi

          done < <(
            find . \
              -type f \
              -name "*.php" \
              -print0
          )

          if [ "$FAILED" -ne 0 ]; then
            echo
            echo "PHP lint failed."
            exit 1
          fi

          echo
          echo "All PHP files passed lint."

      # =====================================================
      # 7. Check PHP extensions
      # =====================================================
      - name: Check PHP extensions
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo "PHP Extensions"
          echo "======================================"

          php -r '
          $required = [
              "PDO",
              "pdo_sqlite",
              "sqlite3",
              "openssl"
          ];

          foreach ($required as $ext) {

              if ($ext === "PDO") {

                  if (!class_exists("PDO")) {
                      fwrite(STDERR, "PDO is missing\n");
                      exit(1);
                  }

              } elseif (!extension_loaded($ext)) {

                  fwrite(
                      STDERR,
                      "Missing extension: $ext\n"
                  );

                  exit(1);
              }

              echo "$ext: OK\n";
          }
          '

      # =====================================================
      # 8. Test configuration
      # =====================================================
      - name: Test application configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PANEL_DIR"

          echo "Loading configuration..."

          php -r '
          require "app/config.php";

          echo "config.php loaded successfully." . PHP_EOL;
          '

      # =====================================================
      # 9. Test SQLite
      # =====================================================
      - name: Test SQLite database
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PANEL_DIR"

          echo "======================================"
          echo "SQLite Test"
          echo "======================================"

          php -r '
          require "app/config.php";

          $pdo = db();

          if (!$pdo instanceof PDO) {
              fwrite(
                  STDERR,
                  "Database connection failed\n"
              );

              exit(1);
          }

          echo "Database connection: OK" . PHP_EOL;

          $tables = $pdo->query(
              "SELECT name
               FROM sqlite_master
               WHERE type = '\''table'\''
               ORDER BY name"
          )->fetchAll(PDO::FETCH_COLUMN);

          echo PHP_EOL;
          echo "Tables:" . PHP_EOL;

          foreach ($tables as $table) {
              echo " - " . $table . PHP_EOL;
          }

          if (in_array("repositories", $tables, true)) {
              echo "repositories table: OK" . PHP_EOL;
          }

          if (in_array("servers", $tables, true)) {
              echo "servers table: OK" . PHP_EOL;
          }

          echo "SQLite test completed." . PHP_EOL;
          '

      # =====================================================
      # 10. Test repository functions
      # =====================================================
      - name: Test repository functions
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PANEL_DIR"

          php -r '
          require "app/config.php";

          echo "Testing repository functions..." . PHP_EOL;

          if (function_exists("db")) {
              echo "db(): OK" . PHP_EOL;
          }

          if (function_exists("repository_by_username")) {
              echo "repository_by_username(): OK" . PHP_EOL;
          }

          if (function_exists("parse_ports")) {
              echo "parse_ports(): OK" . PHP_EOL;
          }

          if (function_exists("parse_protocols")) {
              echo "parse_protocols(): OK" . PHP_EOL;
          }

          echo "Repository functions loaded." . PHP_EOL;
          '

      # =====================================================
      # 11. Start PHP web server
      # =====================================================
      - name: Start PHP server
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PANEL_DIR"

          php \
            -S 127.0.0.1:8080 \
            -t public \
            > /tmp/tunnelcat-php.log 2>&1 &

          echo $! > /tmp/tunnelcat-php.pid

          echo "Waiting for PHP server..."

          READY=0

          for i in $(seq 1 20); do

            if curl \
              --silent \
              --show-error \
              --fail \
              http://127.0.0.1:8080/ \
              >/tmp/tunnelcat-index.html; then

              READY=1
              break

            fi

            sleep 1

          done

          if [ "$READY" -ne 1 ]; then

            echo "ERROR: PHP server did not start."

            echo
            echo "PHP server log:"
            cat /tmp/tunnelcat-php.log

            exit 1
          fi

          echo "PHP server started successfully."

      # =====================================================
      # 12. Test main page
      # =====================================================
      - name: Test main page
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Testing:"
          echo "http://127.0.0.1:8080/"

          curl \
            --silent \
            --show-error \
            --fail \
            -D /tmp/headers.txt \
            -o /tmp/index.html \
            http://127.0.0.1:8080/

          echo
          echo "Response headers:"
          cat /tmp/headers.txt

          echo
          echo "Main page response:"
          head -100 /tmp/index.html

          echo
          echo "Main page: OK"

      # =====================================================
      # 13. Test repository endpoint
      # =====================================================
      - name: Test repository endpoint
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Testing repository endpoint..."

          curl \
            --silent \
            --show-error \
            --fail \
            "http://127.0.0.1:8080/repo.php?username=official" \
            -o /tmp/repository.json

          if [ ! -s /tmp/repository.json ]; then
            echo "ERROR: Repository response is empty."
            exit 1
          fi

          echo
          echo "Repository response size:"
          wc -c /tmp/repository.json

          echo
          echo "Repository response:"
          head -c 1000 /tmp/repository.json

          echo
          echo
          echo "Repository endpoint: OK"

      # =====================================================
      # 14. Stop PHP server
      # =====================================================
      - name: Stop PHP server
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/tunnelcat-php.pid ]; then
            kill "$(cat /tmp/tunnelcat-php.pid)" 2>/dev/null || true
          fi

      # =====================================================
      # 15. Final result
      # =====================================================
      - name: Validation successful
        shell: bash
        run: |
          echo "======================================"
          echo "TunnelCat Repository Panel"
          echo "VALIDATION SUCCESS"
          echo "======================================"
