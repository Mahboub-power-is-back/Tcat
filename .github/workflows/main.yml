name: Deploy TunnelCat Panel

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy TunnelCat Panel
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Checkout repository
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. Find and extract website ZIP
      # =====================================================
      - name: Extract TunnelCat website
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo "Repository contents"
          echo "======================================"

          find . -maxdepth 3 -type f | sort

          echo
          echo "======================================"
          echo "Finding website ZIP"
          echo "======================================"

          ZIP=""

          if [ -f "TunnelCat-Website-Server-Panel-v1.zip" ]; then
            ZIP="TunnelCat-Website-Server-Panel-v1.zip"
          elif [ -f "TunnelCat-GitHub-Complete.zip" ]; then
            ZIP="TunnelCat-GitHub-Complete.zip"
          else
            ZIP=$(find . -maxdepth 1 -type f \
              \( -iname "*website*.zip" -o -iname "*panel*.zip" -o -iname "*github*.zip" \) \
              | head -n 1 || true)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: Website ZIP not found."
            exit 1
          fi

          echo "Using website ZIP:"
          echo "$ZIP"

          rm -rf extracted-site
          mkdir -p extracted-site

          unzip -q "$ZIP" -d extracted-site

          echo
          echo "======================================"
          echo "Searching for index.html"
          echo "======================================"

          INDEX_FILE=$(find extracted-site \
            -type f \
            -name "index.html" \
            | head -n 1 || true)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html was not found inside ZIP."

            echo
            echo "Extracted files:"
            find extracted-site -maxdepth 5 -type f | sort

            exit 1
          fi

          SITE_DIR="$(dirname "$INDEX_FILE")"

          echo "index.html found:"
          echo "$INDEX_FILE"

          echo
          echo "Website directory:"
          echo "$SITE_DIR"

          echo "SITE_DIR=$SITE_DIR" >> "$GITHUB_ENV"

      # =====================================================
      # 3. Verify website
      # =====================================================
      - name: Verify website
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================"
          echo "Verifying TunnelCat website"
          echo "======================================"

          test -d "$SITE_DIR"
          test -f "$SITE_DIR/index.html"

          echo "index.html: OK"

          if [ -f "$SITE_DIR/app.js" ]; then
            echo "app.js: OK"
          else
            echo "app.js: not present"
          fi

          if [ -f "$SITE_DIR/style.css" ]; then
            echo "style.css: OK"
          else
            echo "style.css: not present"
          fi

          echo
          echo "Website files:"
          find "$SITE_DIR" -maxdepth 2 -type f | sort

      # =====================================================
      # 4. Setup GitHub Pages
      # =====================================================
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # =====================================================
      # 5. Upload website
      # =====================================================
      - name: Upload TunnelCat website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

      # =====================================================
      # 6. Deploy
      # =====================================================
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # =====================================================
      # 7. Show URL
      # =====================================================
      - name: Show deployment
        shell: bash
        run: |
          echo "======================================"
          echo "TunnelCat Panel deployed successfully"
          echo "======================================"
          echo "GitHub Pages URL:"
          echo "${{ steps.deployment.outputs.page_url }}"
