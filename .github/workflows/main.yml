name: Deploy TunnelCat Panel

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy TunnelCat Panel
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Checkout
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. Verify website
      # =====================================================
      - name: Verify website
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Repository:"
          pwd

          echo
          echo "Files:"
          find . -maxdepth 3 -type f | sort

          echo
          echo "Checking public directory..."

          test -d public
          test -f public/index.html
          test -f public/app.js
          test -f public/style.css

          echo "Website files found."

          echo
          echo "Checking server data..."

          test -f data/servers.json

          echo "Server data found."

      # =====================================================
      # 3. Prepare GitHub Pages
      # =====================================================
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # =====================================================
      # 4. Upload public directory
      # =====================================================
      - name: Upload TunnelCat website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      # =====================================================
      # 5. Deploy
      # =====================================================
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # =====================================================
      # 6. Show URL
      # =====================================================
      - name: Show deployment
        shell: bash
        run: |
          echo "======================================"
          echo "TunnelCat Panel deployed"
          echo "======================================"
          echo "URL:"
          echo "${{ steps.deployment.outputs.page_url }}"
