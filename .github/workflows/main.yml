name: Deploy TunnelCat Panel

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy TunnelCat Panel
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        shell: bash
        run: |
          set -e

          rm -rf _site
          mkdir -p _site

          if [ -d "public" ]; then
            echo "Found public/ directory"
            cp -R public/. _site/
          else
            echo "No public/ directory found"
            echo "Using repository root"

            if [ -f "index.html" ]; then
              cp index.html _site/
            else
              echo "ERROR: index.html was not found"
              exit 1
            fi

            if [ -d "assets" ]; then
              cp -R assets _site/
            fi

            if [ -f "app.js" ]; then
              cp app.js _site/
            fi

            if [ -f "style.css" ]; then
              cp style.css _site/
            fi

            if [ -d "css" ]; then
              cp -R css _site/
            fi

            if [ -d "js" ]; then
              cp -R js _site/
            fi

            if [ -d "images" ]; then
              cp -R images _site/
            fi
          fi

          echo ""
          echo "Website files:"
          find _site -maxdepth 3 -type f -print

          echo ""
          echo "Checking index.html..."

          if [ ! -f "_site/index.html" ]; then
            echo "ERROR: _site/index.html does not exist"
            exit 1
          fi

          echo "index.html OK"

      - name: Upload TunnelCat website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
