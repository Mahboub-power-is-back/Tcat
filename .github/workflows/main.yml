name: Deploy TunnelCat Panel

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy TunnelCat Panel
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 3. Prepare website
      - name: Prepare website
        shell: bash
        run: |
          set -e

          rm -rf _site
          mkdir -p _site

          echo "Checking repository..."

          if [ -d "public" ]; then
            echo "public/ directory found."
            cp -R public/. _site/
          else
            echo "public/ directory not found."
            echo "Checking repository root..."

            if [ -f "index.html" ]; then
              cp index.html _site/
            else
              echo "ERROR: index.html was not found."
              echo "Expected:"
              echo "  public/index.html"
              echo "or:"
              echo "  index.html"
              exit 1
            fi

            if [ -f "app.js" ]; then
              cp app.js _site/
            fi

            if [ -f "style.css" ]; then
              cp style.css _site/
            fi

            if [ -d "assets" ]; then
              cp -R assets _site/
            fi

            if [ -d "css" ]; then
              cp -R css _site/
            fi

            if [ -d "js" ]; then
              cp -R js _site/
            fi

            if [ -d "images" ]; then
              cp -R images _site/
            fi
          fi

          echo ""
          echo "Website files:"
          find _site -maxdepth 5 -type f -print

          echo ""
          echo "Checking index.html..."

          if [ ! -f "_site/index.html" ]; then
            echo "ERROR: _site/index.html does not exist."
            exit 1
          fi

          echo "index.html found."
          echo "Website preparation completed."

      # 4. Upload website
      - name: Upload TunnelCat website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      # 5. Deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
