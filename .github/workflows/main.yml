name: Deploy TunnelCat GitHub Pages

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build GitHub Pages
    runs-on: ubuntu-22.04

    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # SHOW FILES
      # =====================================================
      - name: Show repository
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Repository:"
          pwd

          echo
          find . -maxdepth 4 -type f | sort

      # =====================================================
      # FIND GITHUB PAGES SOURCE
      # =====================================================
      - name: Prepare Pages source
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf _site
          mkdir -p _site

          # -------------------------------------------------
          # Preferred GitHub Pages files
          # -------------------------------------------------
          if [ -f "index.html" ]; then
            cp -R ./* _site/ 2>/dev/null || true
          fi

          # -------------------------------------------------
          # If the complete Pages ZIP is in the repository,
          # extract it.
          # -------------------------------------------------
          ZIP=""

          if [ -f "TunnelCat-GitHub-Pages-Complete.zip" ]; then
            ZIP="TunnelCat-GitHub-Pages-Complete.zip"
          fi

          if [ -n "$ZIP" ]; then

            echo "Pages ZIP found:"
            echo "$ZIP"

            rm -rf /tmp/pages-source
            mkdir -p /tmp/pages-source

            unzip -q "$ZIP" -d /tmp/pages-source

            # Find index.html inside the ZIP.
            INDEX="$(find /tmp/pages-source \
              -type f \
              -name "index.html" \
              | head -n 1 || true)"

            if [ -z "$INDEX" ]; then
              echo "ERROR: index.html not found in Pages ZIP."
              exit 1
            fi

            SOURCE_DIR="$(dirname "$INDEX")"

            echo "Pages source:"
            echo "$SOURCE_DIR"

            rm -rf _site/*
            cp -R "$SOURCE_DIR"/. _site/

          fi

          # -------------------------------------------------
          # Check final website
          # -------------------------------------------------
          if [ ! -f "_site/index.html" ]; then

            echo "ERROR: _site/index.html does not exist."

            echo
            echo "Available HTML files:"
            find . \
              -type f \
              -name "*.html" \
              -print

            exit 1
          fi

          echo
          echo "======================================"
          echo "Pages source prepared"
          echo "======================================"

          find _site \
            -maxdepth 5 \
            -type f \
            | sort

      # =====================================================
      # DISABLE JEKYLL
      # =====================================================
      - name: Disable Jekyll
        shell: bash
        run: |
          set -Eeuo pipefail

          touch _site/.nojekyll

      # =====================================================
      # VERIFY WEBSITE
      # =====================================================
      - name: Verify website
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f "_site/index.html"

          echo "index.html: OK"

          if [ -d "_site/admin" ]; then
            echo "admin directory: OK"
            find "_site/admin" -maxdepth 3 -type f | sort
          fi

          if [ -d "_site/data" ]; then
            echo "data directory: OK"
            find "_site/data" -maxdepth 3 -type f | sort
          fi

          if [ -d "_site/repo" ]; then
            echo "repo directory: OK"
            find "_site/repo" -maxdepth 4 -type f | sort
          fi

      # =====================================================
      # UPLOAD PAGES ARTIFACT
      # =====================================================
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # =========================================================
  # DEPLOY
  # =========================================================
  deploy:
    name: Deploy to GitHub Pages
    needs: build

    runs-on: ubuntu-22.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
